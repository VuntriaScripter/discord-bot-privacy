<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Baguette Française</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at center, #250000 0%, #0a0000 45%, #000000 100%);

            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Effet rouge en arrière-plan */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;

            background: #ff0000;
            opacity: 0.08;

            border-radius: 50%;
            filter: blur(120px);

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 1;
        }

        /* Image */
        .image-container {
            width: 190px;
            height: 190px;

            margin: 0 auto 30px;

            border-radius: 50%;
            overflow: hidden;

            border: 3px solid #ff0000;

            box-shadow:
                0 0 15px #ff0000,
                0 0 40px rgba(255, 0, 0, 0.5),
                inset 0 0 20px #000000;

            background: #050505;
        }

        .image-container img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            /* Effet noir et rouge */
            filter:
                grayscale(100%)
                contrast(1.3)
                brightness(0.7)
                sepia(100%)
                hue-rotate(315deg)
                saturate(500%);
        }

        /* Nom du serveur */
        h1 {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 2px;

            text-transform: uppercase;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(255, 0, 0, 0.7),
                0 0 30px rgba(255, 0, 0, 0.4);
        }

        /* Une partie du texte en rouge */
        h1 span {
            color: #ff0000;

            text-shadow:
                0 0 10px #ff0000,
                0 0 25px rgba(255, 0, 0, 0.7);
        }

        /* Ligne rouge */
        .line {
            width: 180px;
            height: 3px;

            background: #ff0000;

            margin: 22px auto 0;

            box-shadow:
                0 0 10px #ff0000,
                0 0 25px rgba(255, 0, 0, 0.6);

            border-radius: 10px;
        }

        /* Téléphone */
        @media (max-width: 600px) {

            .image-container {
                width: 140px;
                height: 140px;
                margin-bottom: 25px;
            }

            h1 {
                font-size: 30px;
                letter-spacing: 1px;
            }

            .line {
                width: 120px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!--
            Mets ton image dans le même dossier que index.html
            et appelle-la : image.png
        -->

        <div class="image-container">
          <img src="https://img.magnific.com/vecteurs-libre/fond-noir-maille-low-poly-rougeoyante-rougeoyante_1017-20215.jpg?semt=ais_hybrid&w=740&q=80" alt="La Baguette Française">
        </div>

        <h1>
            La Baguette <span>Française</span>
        </h1>

        <div class="line"></div>

    </div>

</body>
</html>
